<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sales Pipeline Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem;
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .input-field {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }
        .btn-primary {
            background-color: #3B82F6;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #2563EB;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: #1F2937;
        }
        .logo-icon {
            color: #3B82F6;
        }
        .error-message {
            color: #EF4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="login-container">
        <div class="text-center mb-8">
            <h1 class="logo mb-2">
                <span class="logo-icon"><i class="fas fa-chart-line"></i></span>
                Sales Pipeline
            </h1>
            <p class="text-gray-600">Sign in to manage your sales opportunities</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required
                    class="input-field"
                    placeholder="your@email.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required
                    class="input-field"
                    placeholder="••••••••">
            </div>

            <div id="errorMessage" class="error-message hidden"></div>

            <button type="submit" class="btn-primary w-full flex items-center justify-center">
                <i class="fas fa-sign-in-alt mr-2"></i> Sign In
            </button>

            <div class="text-center text-sm text-gray-500 mt-4">
                Don't have an account? 
                <a href="#" id="registerLink" class="text-blue-600 hover:text-blue-800">Register here</a>
            </div>
        </form>

        <form id="registerForm" class="space-y-4 hidden">
            <div>
                <label for="regEmail" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="regEmail" required
                    class="input-field"
                    placeholder="your@email.com">
            </div>

            <div>
                <label for="regPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="regPassword" required
                    class="input-field"
                    placeholder="••••••••">
            </div>

            <div>
                <label for="regConfirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="regConfirmPassword" required
                    class="input-field"
                    placeholder="••••••••">
            </div>

            <div id="regErrorMessage" class="error-message hidden"></div>

            <div class="flex space-x-3">
                <button type="button" id="backToLogin" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg flex-1">
                    Back to Login
                </button>
                <button type="submit" class="btn-primary flex-1 flex items-center justify-center">
                    <i class="fas fa-user-plus mr-2"></i> Register
                </button>
            </div>
        </form>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA630jQdTLNt1XHjVAXX10IjIeMVJ_vNn8",
            authDomain: "pipelineefk.firebaseapp.com",
            projectId: "pipelineefk",
            storageBucket: "pipelineefk.appspot.com",
            messagingSenderId: "763507094626",
            appId: "1:763507094626:web:57838068505c964f654d3b"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // DOM elements
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const registerLink = document.getElementById('registerLink');
        const backToLogin = document.getElementById('backToLogin');
        const errorMessage = document.getElementById('errorMessage');
        const regErrorMessage = document.getElementById('regErrorMessage');

        // Toggle between login and register forms
        registerLink.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
        });

        backToLogin.addEventListener('click', () => {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            regErrorMessage.classList.add('hidden');
        });

        // Handle login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Redirect to main app page
                    window.location.href = 'code (7).html'; // Replace with your main page filename
                })
                .catch((error) => {
                    errorMessage.textContent = error.message;
                    errorMessage.classList.remove('hidden');
                });
        });

        // Handle registration
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                regErrorMessage.textContent = "Passwords don't match";
                regErrorMessage.classList.remove('hidden');
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Redirect to main app page after successful registration
                    window.location.href = 'code (7).html'; // Replace with your main page filename
                })
                .catch((error) => {
                    regErrorMessage.textContent = error.message;
                    regErrorMessage.classList.remove('hidden');
                });
        });

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is signed in, redirect to main page
                window.location.href = 'code (7).html'; // Replace with your main page filename
            }
        });
    </script>
</body>
</html>
