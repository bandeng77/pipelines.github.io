<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Pipeline Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .pipeline-stage {
            min-height: 300px;
            transition: all 0.3s ease;
        }
        .deal-card {
            transition: transform 0.2s;
        }
        .deal-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .stage-prospect { border-left: 4px solid #3B82F6; }
        .stage-qualification { border-left: 4px solid #10B981; }
        .stage-proposal { border-left: 4px solid #F59E0B; }
        .stage-negotiation { border-left: 4px solid #EC4899; }
        .stage-closed { border-left: 4px solid #8B5CF6; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-4">
        <!-- Header -->
        <header class="py-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Sales Pipeline Manager</h1>
                    <p class="text-gray-600">Visualize and track your sales opportunities</p>
                </div>
                <div class="flex space-x-4">
                    <button onclick="openModal('addDealModal')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                        + New Deal
                    </button>
                    <button onclick="showStats()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg">
                        View Stats
                    </button>
                </div>
            </div>
        </header>

        <!-- Pipeline Visualization -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-8">
            <div class="pipeline-stage stage-prospect bg-white p-4 rounded-lg shadow">
                <h3 class="font-semibold text-lg mb-4">Prospect</h3>
                <div id="prospect-stage" class="space-y-3">
                    <!-- Deal cards will be inserted here by JavaScript -->
                </div>
            </div>
            <div class="pipeline-stage stage-qualification bg-white p-4 rounded-lg shadow">
                <h3 class="font-semibold text-lg mb-4">Qualification</h3>
                <div id="qualification-stage" class="space-y-3"></div>
            </div>
            <div class="pipeline-stage stage-proposal bg-white p-4 rounded-lg shadow">
                <h3 class="font-semibold text-lg mb-4">Proposal</h3>
                <div id="proposal-stage" class="space-y-3"></div>
            </div>
            <div class="pipeline-stage stage-negotiation bg-white p-4 rounded-lg shadow">
                <h3 class="font-semibold text-lg mb-4">Negotiation</h3>
                <div id="negotiation-stage" class="space-y-3"></div>
            </div>
            <div class="pipeline-stage stage-closed bg-white p-4 rounded-lg shadow">
                <h3 class="font-semibold text-lg mb-4">Closed</h3>
                <div id="closed-stage" class="space-y-3"></div>
            </div>
        </div>

        <!-- Recent Activity Section -->
        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-xl font-semibold mb-4">Recent Activity</h2>
            <div id="activity-feed" class="space-y-4">
                <div class="p-4 bg-gray-50 rounded-lg">
                    <p class="text-gray-500">System: Welcome to your sales pipeline! Add your first deal to get started.</p>
                </div>
            </div>
        </div>

        <!-- Stats Section (hidden by default) -->
        <div id="stats-section" class="hidden bg-white p-6 rounded-lg shadow mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Sales Performance</h2>
                <button onclick="hideStats()" class="text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <canvas id="dealSizeChart"></canvas>
                </div>
                <div>
                    <canvas id="winRateChart"></canvas>
                </div>
            </div>
            <div class="mt-6">
                <canvas id="pipelineValueChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Add Deal Modal -->
    <div id="addDealModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h2 class="text-xl font-semibold mb-4">Add New Deal</h2>
            <form id="dealForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="dealName">Deal Name</label>
                    <input type="text" id="dealName" class="w-full p-2 border rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="companyName">Company</label>
                    <input type="text" id="companyName" class="w-full p-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="contactName">Contact Name</label>
                    <input type="text" id="contactName" class="w-full p-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="value">Value ($)</label>
                    <input type="number" id="value" class="w-full p-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="stage">Stage</label>
                    <select id="stage" class="w-full p-2 border rounded-lg">
                        <option value="prospect">Prospect</option>
                        <option value="qualification">Qualification</option>
                        <option value="proposal">Proposal</option>
                        <option value="negotiation">Negotiation</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeModal('addDealModal')" class="px-4 py-2 text-gray-600 hover:text-gray-800">
                        Cancel
                    </button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                        Save Deal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Sample data
        let deals = [];
        let activities = [
            { id: 1, text: "System: Welcome to your sales pipeline! Add your first deal to get started.", date: new Date() }
        ];

        // Initialize Sortable for drag and drop
        document.addEventListener('DOMContentLoaded', function() {
            new Sortable(document.getElementById('prospect-stage'), {
                group: 'pipeline',
                animation: 150,
                onEnd: updateDealStage
            });
            
            new Sortable(document.getElementById('qualification-stage'), {
                group: 'pipeline',
                animation: 150,
                onEnd: updateDealStage
            });
            
            new Sortable(document.getElementById('proposal-stage'), {
                group: 'pipeline',
                animation: 150,
                onEnd: updateDealStage
            });
            
            new Sortable(document.getElementById('negotiation-stage'), {
                group: 'pipeline',
                animation: 150,
                onEnd: updateDealStage
            });
            
            new Sortable(document.getElementById('closed-stage'), {
                group: 'pipeline',
                animation: 150,
                onEnd: updateDealStage
            });

            // Form submission
            document.getElementById('dealForm').addEventListener('submit', function(e) {
                e.preventDefault();
                addNewDeal();
            });
        });

        // Modal functions
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById('dealForm').reset();
        }

        function showStats() {
            document.getElementById('stats-section').classList.remove('hidden');
            updateCharts();
        }

        function hideStats() {
            document.getElementById('stats-section').classList.add('hidden');
        }

        // Deal functions
        function addNewDeal() {
            const dealName = document.getElementById('dealName').value;
            const companyName = document.getElementById('companyName').value;
            const contactName = document.getElementById('contactName').value;
            const value = document.getElementById('value').value;
            const stage = document.getElementById('stage').value;
            
            const newDeal = {
                id: Date.now(),
                name: dealName,
                company: companyName,
                contact: contactName,
                value: value ? parseFloat(value) : 0,
                stage: stage,
                created: new Date()
            };
            
            deals.push(newDeal);
            renderDeal(newDeal);
            
            // Add activity
            addActivity(`Added new deal: ${dealName}`);
            
            closeModal('addDealModal');
            document.getElementById('dealForm').reset();
        }

        function renderDeal(deal) {
            const dealCard = document.createElement('div');
            dealCard.className = 'deal-card bg-white p-3 rounded-lg cursor-move shadow';
            dealCard.dataset.id = deal.id;
            
            dealCard.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h4 class="font-medium">${deal.name}</h4>
                    <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">$${deal.value.toLocaleString()}</span>
                </div>
                <p class="text-sm text-gray-600 mb-1">${deal.company}</p>
                <p class="text-xs text-gray-500">${deal.contact}</p>
                <div class="flex justify-between items-center mt-3">
                    <button onclick="showDealDetails(${deal.id})" class="text-xs text-blue-600 hover:text-blue-800">Details</button>
                    <span class="text-xs text-gray-500">${deal.created.toLocaleDateString()}</span>
                </div>
            `;
            
            document.getElementById(`${deal.stage}-stage`).appendChild(dealCard);
        }

        function updateDealStage(evt) {
            const dealId = parseInt(evt.item.dataset.id);
            const newStage = evt.to.id.replace('-stage', '');
            
            const dealIndex = deals.findIndex(d => d.id === dealId);
            if (dealIndex !== -1) {
                deals[dealIndex].stage = newStage;
                addActivity(`Moved ${deals[dealIndex].name} to ${newStage} stage`);
            }
        }

        function addActivity(text) {
            const newActivity = {
                id: Date.now(),
                text: text,
                date: new Date()
            };
            
            activities.unshift(newActivity);
            
            // Add to activity feed
            const activityElement = document.createElement('div');
            activityElement.className = 'p-4 bg-gray-50 rounded-lg';
            activityElement.innerHTML = `
                <p class="text-gray-500">${newActivity.text}</p>
                <p class="text-xs text-gray-400 mt-1">${newActivity.date.toLocaleString()}</p>
            `;
            
            const activityFeed = document.getElementById('activity-feed');
            if (activityFeed.firstChild) {
                activityFeed.insertBefore(activityElement, activityFeed.firstChild);
            } else {
                activityFeed.appendChild(activityElement);
            }
        }

        function updateCharts() {
            // Deal size distribution chart
            const dealSizeCtx = document.getElementById('dealSizeChart').getContext('2d');
            new Chart(dealSizeCtx, {
                type: 'bar',
                data: {
                    labels: ['$0-$1000', '$1000-$5000', '$5000-$10000', '$10000+'],
                    datasets: [{
                        label: 'Number of Deals',
                        data: calculateDealSizeDistribution(),
                        backgroundColor: [
                            'rgba(59, 130, 246, 0.6)',
                            'rgba(16, 185, 129, 0.6)',
                            'rgba(245, 158, 11, 0.6)',
                            'rgba(236, 72, 153, 0.6)'
                        ],
                        borderColor: [
                            'rgba(59, 130, 246, 1)',
                            'rgba(16, 185, 129, 1)',
                            'rgba(245, 158, 11, 1)',
                            'rgba(236, 72, 153, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Deal Size Distribution'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // Win rate chart
            const winRateCtx = document.getElementById('winRateChart').getContext('2d');
            new Chart(winRateCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Closed Won', 'Closed Lost', 'In Progress'],
                    datasets: [{
                        data: [25, 15, 60], // Sample data
                        backgroundColor: [
                            'rgba(139, 92, 246, 0.6)',
                            'rgba(239, 68, 68, 0.6)',
                            'rgba(59, 130, 246, 0.6)'
                        ],
                        borderColor: [
                            'rgba(139, 92, 246, 1)',
                            'rgba(239, 68, 68, 1)',
                            'rgba(59, 130, 246, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Win Rate'
                        },
                        legend: {
                            position: 'right',
                        }
                    }
                }
            });

            // Pipeline value chart
            const pipelineValueCtx = document.getElementById('pipelineValueChart').getContext('2d');
            new Chart(pipelineValueCtx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Pipeline Value',
                        data: [15000, 25000, 35000, 30000, 40000, 45000], // Sample data
                        fill: true,
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Pipeline Value Trend'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function calculateDealSizeDistribution() {
            // Sample implementation - would need to calculate based on actual deals
            return [5, 8, 3, 2];
        }

        function showDealDetails(dealId) {
            const deal = deals.find(d => d.id === dealId);
            if (!deal) return;

            alert(`Deal Details:\n\nName: ${deal.name}\nCompany: ${deal.company}\nContact: ${deal.contact}\nValue: $${deal.value}\nStage: ${deal.stage}\nCreated: ${deal.created.toLocaleDateString()}`);
        }
    </script>
</body>
</html>
