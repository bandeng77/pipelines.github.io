<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Pipeline Manager - Genetek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <style>
        /* [Semua style CSS yang sama tetap dipertahankan] */
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- [Semua struktur HTML yang sama tetap dipertahankan] -->

    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA630jQdTLNt1XHjVAXX10IjIeMVJ_vNn8",
            authDomain: "pipelineefk.firebaseapp.com",
            projectId: "pipelineefk",
            storageBucket: "pipelineefk.appspot.com",
            messagingSenderId: "763507094626",
            appId: "1:763507094626:web:57838068505c964f654d3b"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const dealsCollection = db.collection('deals');
        const activitiesCollection = db.collection('activities');
        const usersCollection = db.collection('users');

        let deals = [];
        let activities = [];
        let charts = {};
        const DEFAULT_STAGE = 'main-pipeline';
        let currentUserRole = 'user';
        let sortableInstances = {};
        let authInitialized = false;

        // Fungsi untuk menangani perubahan status autentikasi
        auth.onAuthStateChanged(async (user) => {
            if (authInitialized) return;
            authInitialized = true;
            
            console.log("Auth state changed:", user ? user.email : "no user");
            
            // Jika tidak ada user DAN kita di app.html
            if (!user && window.location.pathname.includes('app.html')) {
                console.log("No user, redirecting to login");
                window.location.href = 'login.html';
                return;
            }
            
            // Jika ada user tapi di login.html
            if (user && window.location.pathname.includes('login.html')) {
                console.log("User already logged in, redirecting to app");
                window.location.href = 'app.html';
                return;
            }

            // Jika user ada dan di app.html
            if (user && window.location.pathname.includes('app.html')) {
                try {
                    // Cek role admin
                    if (user.email === 'admin@genetek.co.id') {
                        currentUserRole = 'admin';
                        await usersCollection.doc(user.uid).set({ 
                            role: 'admin',
                            email: user.email 
                        }, { merge: true });
                    } else {
                        const userDoc = await usersCollection.doc(user.uid).get();
                        currentUserRole = userDoc.exists ? userDoc.data().role : 'user';
                    }

                    console.log("Current role:", currentUserRole);
                    applyUserPermissions();
                    loadDealsFromFirebase();
                    loadActivitiesFromFirebase();
                } catch (error) {
                    console.error("Error checking user role:", error);
                    showToast("Gagal memuat data pengguna", 3000);
                }
            }
        });

        // Fungsi untuk menerapkan permissions berdasarkan role
        function applyUserPermissions() {
            const isAdmin = currentUserRole === 'admin';
            const currentUserEmail = auth.currentUser?.email;
            
            console.log("Applying permissions for:", currentUserEmail, "Role:", currentUserRole);
            
            // Tampilkan semua fitur untuk admin
            if (isAdmin) {
                document.getElementById('viewStatsBtn').classList.remove('hidden');
                document.getElementById('activityBtn').classList.remove('hidden');
                document.getElementById('newDealBtn').classList.remove('hidden');
            } else {
                // Sembunyikan fitur admin untuk user biasa
                document.getElementById('viewStatsBtn').classList.add('hidden');
                document.getElementById('activityBtn').classList.add('hidden');
                
                // Tetap tampilkan tombol new deal untuk semua user
                document.getElementById('newDealBtn').classList.remove('hidden');
            }

            // Inisialisasi ulang sortable dengan permission yang benar
            if (sortableInstances['pipelines-stage']) {
                sortableInstances['pipelines-stage'].option('disabled', !isAdmin);
            }
        }

        // Fungsi logout
        function logout() {
            auth.signOut()
                .then(() => {
                    console.log("User logged out successfully");
                    // Clear any existing deals/activities data
                    deals = [];
                    activities = [];
                    // Redirect to login page
                    window.location.href = 'login.html';
                })
                .catch((error) => {
                    console.error("Error logging out:", error);
                    showToast("Gagal logout. Silakan coba lagi.", 5000);
                });
        }

        // Fungsi untuk memuat deals dari Firebase
        function loadDealsFromFirebase() {
            console.log("Loading deals from Firebase...");
            
            let query = dealsCollection.orderBy("createdAt", "desc");
            
            // Jika bukan admin, hanya tampilkan deals yang dibuat oleh user tersebut
            if (currentUserRole !== 'admin') {
                const currentUserEmail = auth.currentUser?.email;
                query = query.where("salesName", "==", currentUserEmail || "");
            }
            
            query.get()
                .then((querySnapshot) => {
                    deals = [];
                    querySnapshot.forEach((doc) => {
                        deals.push({ id: doc.id, ...doc.data() });
                    });
                    console.log("Deals loaded:", deals.length);
                    renderAllDeals();
                })
                .catch((error) => {
                    console.error("Error loading deals:", error);
                    showToast("Gagal memuat data deals", 3000);
                });
        }

        // Fungsi untuk menampilkan toast notifikasi
        function showToast(message, duration = 3000) {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            toastContainer.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                toast.addEventListener('transitionend', () => toast.remove(), { once: true });
            }, duration);
        }

        // Fungsi untuk merender semua deals
        function renderAllDeals() {
            const pipelineStage = document.getElementById('pipelines-stage');
            
            if (deals.length === 0) {
                pipelineStage.innerHTML = `
                    <div class="empty-stage-message text-center text-gray-400 p-4 text-sm">
                        <i class="fas fa-search text-3xl mb-2"></i>
                        <p>Tidak ada deals yang ditemukan</p>
                    </div>
                `;
                return;
            }

            pipelineStage.innerHTML = '';
            deals.forEach(deal => {
                pipelineStage.appendChild(renderDeal(deal));
            });

            // Inisialisasi SortableJS untuk drag and drop
            initSortable();
        }

        // [Fungsi-fungsi lainnya seperti renderDeal, initSortable, saveDeal, dll.]
        // ... (tetap dipertahankan sesuai kebutuhan aplikasi)

        // Inisialisasi saat DOM siap
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('dealForm').addEventListener('submit', function(e) {
                e.preventDefault();
                saveDeal();
            });
            
            // Inisialisasi sortable
            initSortable();
        });
    </script>
</body>
</html>
